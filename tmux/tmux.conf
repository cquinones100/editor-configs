# ── General ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
setw -g mode-keys vi
set -g focus-events on
set -g extended-keys on
setw -g automatic-rename off

# ── Status bar ─────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour248'

# Left: session name, then how many of its tabs have a Claude session waiting on
# you (!), how many have responded unseen (✓), and how many are working (⋯), in
# the same badges as the
# tabs. tmux counts them while drawing (#{W:} walks the session's windows, #{n:}
# measures the result), so nothing runs to produce them; a zero hides its badge.
set -g @agent_counts '#{?#{n:#{W:#{?#{==:#{@agent},waiting},x,}}},#[bg=colour220]#[fg=colour232]#[bold]  ! #{n:#{W:#{?#{==:#{@agent},waiting},x,}}}  ,}#{?#{n:#{W:#{?#{==:#{@agent},done},x,}}},#[bg=colour41]#[fg=colour232]#[bold]  ✓ #{n:#{W:#{?#{==:#{@agent},done},x,}}}  ,}#{?#{n:#{W:#{?#{==:#{@agent},working},x,}}},#[bg=colour67]#[fg=colour255]#[bold]  ⋯ #{n:#{W:#{?#{==:#{@agent},working},x,}}}  ,}'
set -g status-left-length 40
set -g status-left '#[bg=colour24,fg=colour255,bold]  #S #{E:@agent_counts}#[bg=colour235] '

# Right: nothing shown, so the tabs get the whole row. It stays defined because
# tmux-continuum hangs its autosave on status-right (see theme.sh); the length is
# only a maximum, and an empty right side takes no space.
set -g status-right-length 40
set -g status-right ''

# Window tabs
# The Claude session mark, from @agent, which agent-state.sh keeps: a black !
# on yellow when it is waiting on you, a black ✓ on green when it has
# responded and you have not looked, a white ⋯ on muted blue while it works,
# a colour that reads as busy rather than as needing you. The marks are
# badges with their own background because tab names are already drawn in
# each project's accent colour, and a coloured dot vanishes on a tab of the
# same colour. Every window-status format expands the marker after the index,
# then restores its own background, colour and weight, and adds a space when
# there is a mark. Styles inside the #{?...} branches are separate #[...]
# blocks because a comma would end the branch.
set -g @agent_marker '#{?#{==:#{@agent},waiting},#[bg=colour220]#[fg=colour232]#[bold]  !  ,#{?#{==:#{@agent},done},#[bg=colour41]#[fg=colour232]#[bold]  ✓  ,#{?#{==:#{@agent},working},#[bg=colour67]#[fg=colour255]#[bold]  ⋯  ,}}}'
setw -g window-status-format '#[fg=colour244] #I:#{E:@agent_marker}#[bg=default,fg=colour244,nobold]#{?@agent, ,}#W '
setw -g window-status-current-format '#[bg=colour238,fg=colour81,bold] #I:#{E:@agent_marker}#[bg=colour238,fg=colour81,bold]#{?@agent, ,}#W '
setw -g window-status-separator ''

# Second line: the focused window in full. Its label is the tab's, uncut, and
# Claude panes add the session's title and last prompt. No style of its own,
# so it takes status-style and follows theme.sh.
set -g status 2
set -g 'status-format[1]' '#[align=left]  #(~/.config/tmux/tab-status.sh #{q:pane_id} #{q:pane_current_path} #{q:pane_current_command} #{q:pane_tty})'

# ── Pane borders ───────────────────────────────────────
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour81'

# ── Dim inactive panes ────────────────────────────────
set -g window-style 'bg=colour236'
set -g window-active-style 'bg=terminal'

# ── Message / command prompt ───────────────────────────
set -g message-style 'bg=colour235,fg=colour81'
set -g message-command-style 'bg=colour235,fg=colour81'

# ── Prefix ────────────────────────────────────────────
set -g prefix M-b
unbind C-b
bind M-b send-prefix

# ── Vim-style pane navigation (C-w h/j/k/l) ───────────
# Mirrors nvim's <C-w>h/j/k/l. If nvim is the focused pane, forward C-w
# straight through so its native window prefix works (and
# christoomey/vim-tmux-navigator hands off back to tmux at the edges).
# Otherwise enter a key-table where h/j/k/l select panes.
is_vim="ps -o state= -o comm= -t #{q:pane_tty} \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-w if-shell "$is_vim" 'send-keys C-w' 'switch-client -T window-nav'
bind -T window-nav h select-pane -L
bind -T window-nav j select-pane -D
bind -T window-nav k select-pane -U
bind -T window-nav l select-pane -R

# ── Window navigation (alt+[]) ────────────────────────
bind -N "Previous tab" -n M-[ previous-window
bind -N "Next tab" -n M-] next-window

# ── Window by number (alt+1..9) ───────────────────────
# One keystroke instead of prefix + number. Tabs start at 1 (base-index), so
# M-1 is the first tab. Only M-1 carries a description, so the M-p palette
# lists one entry for all nine.
bind -N "Go to a tab by number (M-1 to M-9)" -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
# Tabs past 9: M-0 asks for the number in a popup (tmux/tab-goto.sh).
bind -N "Go to a tab by number, for tabs past 9" -n M-0 \
  display-popup -E -w 32 -h 6 -T ' Go to tab ' "~/.config/tmux/tab-goto.sh"

# ── Reopen a worktree (alt+o) ─────────────────────────
# fzf over the worktrees no tab has open, in every repository your tabs and
# recent Claude sessions use, most recently used first, each with the last
# prompt given there. Picking one opens a tab in it and resumes its Claude with
# claude-here, as wtr does. window-revive.sh puts node on the PATH and runs
# bin/wt-revive, so this needs `./sync.sh wt-revive` as well as tmux.
# display-popup doesn't expand formats in its command, so the directory comes
# in through -d.
bind -N "Reopen a worktree with no tab and resume its Claude" -n M-o display-popup -E -w 80% -h 50% -d '#{pane_current_path}' "~/.config/tmux/window-revive.sh"

# ── Window jump (alt+j) ───────────────────────────────
# fzf over every window, labelled by repository and branch. wt-jump takes a
# ticket, PR number, or branch fragment as an argument too; the popup is for
# when you would rather look than remember.
bind -N "Search and jump to a tab" -n M-j display-popup -E -w 70% -h 50% "~/.config/tmux/window-jump.sh"

# ── Slack relay (alt+shift+s) ─────────────────────────
# M-S opens bin/slack-relay in its own tab, or goes to that tab if it is
# running; C-M-s stops it.
bind -N "Open the Slack relay in its own tab" -n M-S run-shell -b '~/.config/tmux/slack-relay-open.sh start'
bind -N "Stop the Slack relay" -n C-M-s run-shell -b '~/.config/tmux/slack-relay-open.sh stop'

# ── Notes (alt+shift+n) ──────────────────────────────
# M-N opens bin/notes in its own tab, or goes to that tab if it is open.
bind -N "Open Notes in its own tab" -n M-N run-shell -b '~/.config/tmux/notes-open.sh #{q:client_name}'

# ── Next Claude session that needs you (alt+a) ───────
# The tab waiting longest on you, then the one finished longest ago that you
# have not looked at. Pressing it again moves on to the next.
bind -N "Go to the next Claude session waiting on you" -n M-a run-shell -b '~/.config/tmux/agent-state.sh next'

# ── Window creation (alt+t) ─────────────────────────
# Asks for a name straight away; Enter or Esc skips it. The tab goes at the end
# (no -a), so the other tabs keep their numbers and M-1 to M-9 still reach the
# tabs they did.
bind -N "New tab" -n M-t new-window -c "#{pane_current_path}" \; \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 8 -T ' New tab ' "~/.config/tmux/tab-name.zsh optional"

# ── Window naming (alt+n) ───────────────────────────
# The name replaces the ticket or directory in the tab and the second status
# line until it is cleared.
bind -N "Rename the tab" -n M-n display-popup -d '#{pane_current_path}' -E -w 90 -h 8 -T ' Name tab ' "~/.config/tmux/tab-name.zsh"

# ── Sidebar and mission control (alt+h, alt+space) ───
# bin/tmux-sidebar draws the tabs in a sidebar on the left of every window,
# most in need of you first, and mission control, every tab with its latest
# Claude turn, full screen. One daemon draws both; tmux/sidebar.sh starts it.
# M-h moves into the sidebar and back out; in it j/k choose a tab and Enter
# goes there. In mission control hjkl choose and Enter goes there; in either,
# an Alt or Ctrl key you have bound runs in the chosen tab. M-p turns the
# sidebar off and on (it is in the palette table).
#
# The sidebar is a pane, so a binding that acts on "the pane" would act on it
# while it has focus. Those bindings start with leave-sidebar, which hands
# focus back to the pane you came from when the sidebar has it, and does
# nothing otherwise. Give a new pane binding the same start.
set -s command-alias[100] 'leave-sidebar=if -F "#{@sidebar}" "last-pane"'
bind -N "Move into or out of the sidebar" -n M-h if -F '#{@sidebar}' 'last-pane' 'run-shell -b "~/.config/tmux/sidebar.sh focus #{q:window_id}"'
bind -N "Go back to the previous tab" -n M-Tab leave-sidebar \; last-window
bind -N "Open or close mission control" -n M-Space run-shell -b '~/.config/tmux/sidebar.sh mission #{q:client_name}'
bind -T palette -N "Turn the sidebar on or off" b run-shell -b '~/.config/tmux/sidebar.sh toggle'
# Changes nothing else announces reach the sidebar at once rather than at the
# daemon's next look, five seconds later.
set-hook -g after-new-window "run-shell -b '~/.config/tmux/sidebar.sh nudge'"
set-hook -g window-unlinked "run-shell -b '~/.config/tmux/sidebar.sh nudge'"
set-hook -g client-resized "run-shell -b '~/.config/tmux/sidebar.sh nudge'"
run-shell -b '~/.config/tmux/sidebar.sh start'

# ── Pane creation (alt+shift+hjkl) ───────────────────
bind -N "Split pane to the left" -n M-H leave-sidebar \; split-window -hb -c "#{pane_current_path}"
bind -N "Split pane below" -n M-J leave-sidebar \; split-window -v -c "#{pane_current_path}"
bind -N "Split pane above" -n M-K leave-sidebar \; split-window -vb -c "#{pane_current_path}"
bind -N "Split pane to the right" -n M-L leave-sidebar \; split-window -h -c "#{pane_current_path}"

# ── Pane search (alt+f) ─────────────────────────────
bind -N "Search the pane's scrollback" -n M-f leave-sidebar \; copy-mode \; send-keys /

# ── Pane close (alt+w) ──────────────────────────────
bind -N "Close the pane" -n M-w leave-sidebar \; display-popup -E -w 60 -h 6 "~/.config/tmux/confirm.sh 'Close pane?' #{pane_id}"

# ── Pane zoom (alt+=) ───────────────────────────────
bind -N "Zoom the pane in or out" -n M-= leave-sidebar \; resize-pane -Z

# ── Pane resizing (alt+shift+arrow) ─────────────────
bind -N "Grow pane left" -n M-S-Left leave-sidebar \; resize-pane -L 5
bind -N "Grow pane down" -n M-S-Down leave-sidebar \; resize-pane -D 5
bind -N "Grow pane up" -n M-S-Up leave-sidebar \; resize-pane -U 5
bind -N "Grow pane right" -n M-S-Right leave-sidebar \; resize-pane -R 5

# ── Lazygit in place of the pane (ctrl+l) ───────────
# lazygit takes the pane's place, the rest of the window (sidebar included)
# staying as it is, and quitting it puts the pane back (tmux/lazygit-pane.sh).
# C-l in lazygit asks to close it, which puts the pane back too.
bind -N "Open lazygit in place of this pane; quitting it brings the pane back" -n C-l leave-sidebar \; if-shell -F '#{==:#{pane_current_command},lazygit}' \
  "display-popup -E -w 72 -h 6 \"~/.config/tmux/confirm.sh 'Close lazygit pane?' #{pane_id}\"" \
  'run-shell -b "~/.config/tmux/lazygit-pane.sh open #{q:pane_id} #{q:pane_current_path}"'

# ── Nvim pane (ctrl+j) ──────────────────────────────
bind -N "Toggle the nvim pane" -n C-j leave-sidebar \; if-shell -F '#{==:#{pane_current_command},nvim}' \
  "display-popup -E -w 68 -h 6 \"~/.config/tmux/confirm.sh 'Close nvim pane?' #{pane_id}\"" \
  'split-window -h -l 75% -c "#{pane_current_path}" nvim'

# ── Shell pane (ctrl+k) ─────────────────────────────
bind -N "Toggle the shell pane" -n C-k leave-sidebar \; run-shell '~/.config/tmux/toggle-shell-pane.sh'

# ── Theme toggle (alt+shift+t) ─────────────────────────
bind -N "Toggle light and dark theme" -n M-T run-shell '~/.config/tmux/theme.sh toggle'

# ── Workspace layout (lazygit + claude + shell) ────────
bind -N "Open the lazygit, claude, and shell workspace" W display-popup -E -w 60% -h 40% '~/.config/tmux/workspace.sh'

# ── Action palette (alt+p) ──────────────────────────
# fzf over every binding above that has a -N description; give a new binding
# one and it shows up here. Commands with no hotkey of their own are bound in
# the palette table, which no key leads to: they are reached only from here,
# and the M-p binding switches the client to that table before pressing them.
# The popup holds the command queue until it closes,
# so the run-shell after it presses the picked key in the pane you came from,
# exactly as if you had typed it. A prefix binding is two keys, sent one call
# at a time because tmux does not act on the second when both arrive in one.
# set -f because keys like M-[ are glob patterns to sh.
bind -N "Show this list" -n M-p display-popup -E -w 70 -h 60% -T ' Actions ' '~/.config/tmux/palette.sh' \; \
  run-shell 'set -f; k=$(tmux show -gqv @palette_choice); tmux set -gu @palette_choice; for key in $k; do if [ "$key" = @palette ]; then tmux switch-client -c #{q:client_name} -T palette; else tmux send-keys -K -c #{q:client_name} "$key"; fi; done'
bind -N "Type gh pr view --web into the pane" P send-keys 'gh pr view --web' Enter
# The path goes in as the popup's start directory: tmux expands formats in -d
# but passes them through untouched in the command, where the shell then reads
# the # as the start of a comment.
bind -N "Check whether the branch's PR is ready to merge" -n M-m \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 16 -T ' Ready to merge? ' "~/.config/tmux/pr-ready.sh --wait"
bind -N "Open the branch's PR in the browser" -n M-r run-shell -b 'cd #{q:pane_current_path} && gh pr view --web 2>/dev/null'
bind -N "Start work on tickets in new tabs (wt)" -n M-W \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 10 -T ' Work on tickets ' "~/.config/tmux/wt-open.zsh"
bind -N "Open a PR in the browser by number or URL" -n M-R \
  display-popup -d '#{pane_current_path}' -E -w 80 -h 9 -T ' Open PR ' "~/.config/tmux/pr-open.zsh"
# M-I (issue) rather than M-L, which splits the pane.
bind -N "Open a Linear ticket in the browser by ID, number or URL" -n M-I \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 9 -T ' Open ticket ' "~/.config/tmux/ticket-open.zsh"
bind -N "Open the repository in the browser" -n M-g run-shell -b 'cd #{q:pane_current_path} && gh repo view --web 2>/dev/null'
# A popup while it asks GitHub which queue, so the key press visibly did
# something; it closes when the browser opens.
bind -N "Open the repository's merge queue in the browser" -n M-q \
  display-popup -d '#{pane_current_path}' -E -w 50 -h 5 -T ' Merge queue ' "~/.config/tmux/merge-queue.sh"
bind -N "Open the branch's Linear ticket in the browser" -n M-l run-shell -b '~/.config/tmux/linear-ticket.sh #{q:pane_current_path}'
# M-p only (see the palette above): no hotkeys.
bind -T palette -N "Copy the branch's ticket ID" t run-shell -b '~/.config/tmux/branch-copy.sh ticket #{q:pane_current_path}'
bind -T palette -N "Copy the branch's ticket URL" T run-shell -b '~/.config/tmux/branch-copy.sh ticket-url #{q:pane_current_path}'
bind -T palette -N "Copy the branch's PR number" p run-shell -b '~/.config/tmux/branch-copy.sh pr #{q:pane_current_path}'
bind -T palette -N "Copy the branch's PR URL" P run-shell -b '~/.config/tmux/branch-copy.sh pr-url #{q:pane_current_path}'
bind -T palette -N "Shape a note's checklist items as Linear tickets" s display-popup -d '#{pane_current_path}' -E -w 110 -h 70% -T ' Shape a note ' '~/.config/tmux/note-shape.sh'
# A flag of its own, not Claude's "done": visiting the tab doesn't clear it.
bind -T palette -N "Flag or unflag this tab as needing you" f if -F '#{@flagged}' 'set -wu @flagged' 'set -w @flagged 1' \; run-shell -b '~/.config/tmux/sidebar.sh nudge'
bind -T palette -N "Send Claude's last reply to another tab" r display-popup -E -w 100 -h 60% -T ' Send the last reply to ' '~/.config/tmux/reply-send.sh'
bind -N "Open the branch's Linear project in the browser" -n M-P run-shell -b '~/.config/tmux/linear-project.sh #{q:pane_current_path} #{q:client_name}'

# ── Accent color (derived from directory + git context) ─
# Updates pane border, session badge, and all window tab colors and names on
# pane focus. Tab names carry their PR number when there is one, which
# window-pr.sh looks up in the background so this stays instant.
# Focusing a sidebar changes neither, so it runs only agent-state.sh, which
# also tells the sidebar to redraw.
set-hook -g pane-focus-in {
  if -F '#{@sidebar}' '' "run-shell -b '~/.config/tmux/update-colors.sh #{q:pane_current_path} #{q:session_name}'"
  run-shell -b '~/.config/tmux/agent-state.sh seen #{q:window_id}'
}

# ── Plugins ───────────────────────────────────────────
# Pinned in tmux/plugins.txt and installed at those commits by `./sync.sh tmux`.
# No plugin manager: TPM cloned itself from its default branch and ran it on
# every start. Each plugin is loaded below, after its options are set.

# Auto-restore sessions on tmux start. The layout is saved every minute, so an
# unplanned restart (a crash, a kill-server, a reboot) loses at most a minute;
# a save that finds nothing changed keeps nothing.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
# Only Claude comes back running: a pane whose command was `claude …` gets
# `claude-here`, which resumes that directory's last session rather than
# retyping the prompt it was started with (which would start the work over).
# This replaces resurrect's default list (vim, less, man…), so every other
# pane comes back at a shell, as before.
set -g @resurrect-default-processes '"claude->claude-here"'
# Saves hold pane contents, so they are made owner-only and trimmed to the
# newest few after each one (see resurrect-tidy.sh).
set -g @resurrect-hook-post-save-all '~/.config/tmux/resurrect-tidy.sh'
# A sidebar added to a window resurrect is still laying out would throw its
# layout off, so the sidebar waits until the restore is done. Sidebar panes
# come back as shells with the sidebar's title, and are given their client again.
set -g @resurrect-hook-pre-restore-all 'tmux set -g @sidebar_hold "$(date +%s)"'
set -g @resurrect-hook-post-restore-all 'tmux set -gu @sidebar_hold; ~/.config/tmux/sidebar.sh nudge'

# Continuum needs resurrect loaded first. A plugin that is missing is skipped
# rather than an error; `./sync.sh tmux` installs it.
if "test -x ~/.config/tmux/plugins/tmux-sensible/sensible.tmux" "run ~/.config/tmux/plugins/tmux-sensible/sensible.tmux"
if "test -x ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" "run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if "test -x ~/.config/tmux/plugins/tmux-continuum/continuum.tmux" "run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"

# ── Apply persisted theme (dark/light) ────────────────
run-shell '~/.config/tmux/theme.sh "$(cat ~/.config/tmux/.theme-mode 2>/dev/null || echo dark)"'
