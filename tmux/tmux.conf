# ── General ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
setw -g mode-keys vi
set -g focus-events on
set -g extended-keys on
setw -g automatic-rename off

# The palette table (M-p's commands with no hotkey, bound below) is emptied
# first, so a command taken out of this file leaves the palette on a reload
# rather than lingering beside its replacement.
unbind -aq -T palette

# ── Status bar ─────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour248'

# Left: session name, then how many of its tabs have a Claude session waiting on
# you (!), how many have responded unseen (✓), and how many are working (⋯), in
# the same badges as the
# tabs. tmux counts them while drawing (#{W:} walks the session's windows, #{n:}
# measures the result), so nothing runs to produce them; a zero hides its badge.
set -g @agent_counts '#{?#{n:#{W:#{?#{==:#{@agent},waiting},x,}}},#[bg=colour220]#[fg=colour232]#[bold]  ! #{n:#{W:#{?#{==:#{@agent},waiting},x,}}}  ,}#{?#{n:#{W:#{?#{==:#{@agent},done},x,}}},#[bg=colour41]#[fg=colour232]#[bold]  ✓ #{n:#{W:#{?#{==:#{@agent},done},x,}}}  ,}#{?#{n:#{W:#{?#{==:#{@agent},working},x,}}},#[bg=colour67]#[fg=colour255]#[bold]  ⋯ #{n:#{W:#{?#{==:#{@agent},working},x,}}}  ,}'
# The session, its counts, and the health light (health.sh) when something is wrong.
set -g status-left-length 80
set -g status-left '#[bg=colour24,fg=colour255,bold]  #S #{E:@agent_counts}#[bg=colour235] #(~/.config/tmux/health.sh)'

# Right: nothing shown, so the tabs get the whole row. It stays defined because
# tmux-continuum hangs its autosave on status-right (see theme.sh); the length is
# only a maximum, and an empty right side takes no space.
set -g status-right-length 40
set -g status-right ''

# Window tabs
# The Claude session mark, from @agent, which agent-state.sh keeps: a black !
# on yellow when it is waiting on you, a black ✓ on green when it has
# responded and you have not looked, a white ⋯ on muted blue while it works,
# a colour that reads as busy rather than as needing you. The marks are
# badges with their own background because tab names are already drawn in
# each project's accent colour, and a coloured dot vanishes on a tab of the
# same colour. Every window-status format expands the marker after the index,
# then restores its own background, colour and weight, and adds a space when
# there is a mark. Styles inside the #{?...} branches are separate #[...]
# blocks because a comma would end the branch.
set -g @agent_marker '#{?#{==:#{@agent},waiting},#[bg=colour220]#[fg=colour232]#[bold]  !  ,#{?#{==:#{@agent},done},#[bg=colour41]#[fg=colour232]#[bold]  ✓  ,#{?#{==:#{@agent},working},#[bg=colour67]#[fg=colour255]#[bold]  ⋯  ,}}}'
setw -g window-status-format '#[fg=colour244] #I:#{E:@agent_marker}#[bg=default,fg=colour244,nobold]#{?@agent, ,}#W '
setw -g window-status-current-format '#[bg=colour238,fg=colour81,bold] #I:#{E:@agent_marker}#[bg=colour238,fg=colour81,bold]#{?@agent, ,}#W '
setw -g window-status-separator ''

# Second line: the focused window in full. Its label is the tab's, uncut, and
# Claude panes add the session's title and last prompt. No style of its own,
# so it takes status-style and follows theme.sh.
set -g status 2
set -g 'status-format[1]' '#[align=left]  #(~/.config/tmux/tab-status.sh #{q:pane_id} #{q:pane_current_path} #{q:pane_current_command} #{q:pane_tty})'

# ── Pane borders ───────────────────────────────────────
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour81'

# ── Dim inactive panes ────────────────────────────────
set -g window-style 'bg=colour236'
set -g window-active-style 'bg=terminal'

# ── Message / command prompt ───────────────────────────
set -g message-style 'bg=colour235,fg=colour81'
set -g message-command-style 'bg=colour235,fg=colour81'

# ── Prefix ────────────────────────────────────────────
set -g prefix M-b
unbind C-b
bind M-b send-prefix

# ── Vim-style pane navigation (C-w h/j/k/l) ───────────
# Mirrors nvim's <C-w>h/j/k/l. If nvim is the focused pane, forward C-w
# straight through so its native window prefix works (and
# christoomey/vim-tmux-navigator hands off back to tmux at the edges).
# Otherwise enter a key-table where h/j/k/l select panes.
is_vim="ps -o state= -o comm= -t #{q:pane_tty} \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-w if-shell "$is_vim" 'send-keys C-w' 'switch-client -T window-nav'
bind -T window-nav h select-pane -L
bind -T window-nav j select-pane -D
bind -T window-nav k select-pane -U
bind -T window-nav l select-pane -R

# ── Window navigation (alt+[]) ────────────────────────
bind -N "Previous tab #tabs #navigate" -n M-[ previous-window
bind -N "Next tab #tabs #navigate" -n M-] next-window

# ── Window by number (alt+1..9) ───────────────────────
# One keystroke instead of prefix + number. Tabs start at 1 (base-index), so
# M-1 is the first tab. Only M-1 carries a description, so the M-p palette
# lists one entry for all nine.
bind -N "Go to a tab by number (M-1 to M-9) #tabs #navigate" -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ── Reopen a worktree (alt+o) ─────────────────────────
# Mission control's Work map, showing only the worktrees no tab has open, in
# every repository your tabs and recent Claude sessions use (bin/wt-revive),
# most recently used first, each with the last prompt given there, a filter
# typing. Enter opens a tab in one and resumes its Claude with claude-here, as
# wtr does; Esc closes.
bind -N "Reopen a worktree with no tab and resume its Claude #worktree #claude #tabs #reopen" -n M-o run-shell -b '~/.config/tmux/sidebar.sh mission #{q:client_name} work:untabbed'

# ── Window jump (alt+j) ───────────────────────────────
# The Work map again, showing only the tabs, a filter typing: type part of a
# ticket, PR or name, Enter goes there. wt-jump still takes a ticket, PR number
# or branch fragment on the command line.
bind -N "Search and jump to a tab #tabs #navigate #find" -n M-j run-shell -b '~/.config/tmux/sidebar.sh mission #{q:client_name} work:tabs'

# ── Slack relay (alt+shift+s) ─────────────────────────
# M-S opens bin/slack-relay in its own tab, or goes to that tab if it is
# running; stopping it is in the palette.
bind -N "Open the Slack relay in its own tab #slack #relay #remote" -n M-S run-shell -b '~/.config/tmux/slack-relay-open.sh start'
bind -T palette -N "Stop the Slack relay #slack #relay #remote" x run-shell -b '~/.config/tmux/slack-relay-open.sh stop'

# ── Notes (alt+shift+n) ──────────────────────────────
# M-N opens bin/notes in its own tab, or goes to that tab if it is open.
bind -N "Go to Notes, wherever it is open, or open it in its own tab #notes #navigate" -n M-N run-shell -b '~/.config/tmux/notes-open.sh #{q:client_name}'
# M-e, which puts the same Notes beside the pane you are in, is bound after
# leave-sidebar is defined, below.

# ── Next Claude session that needs you (alt+a) ───────
# The tab waiting longest on you, then the one finished longest ago that you
# have not looked at. Pressing it again moves on to the next.
bind -N "Go to the next Claude session waiting on you #claude #tabs #navigate" -n M-a run-shell -b '~/.config/tmux/agent-state.sh next'

# ── Window creation (alt+t) ─────────────────────────
# Asks which directory first (tmux/new-tab.zsh: an fzf list of the ones you
# work in, the current one on top), then for a name; Enter or Esc skips the
# name. The tab goes at the end
# (no -a), so the other tabs keep their numbers and M-1 to M-9 still reach the
# tabs they did. It starts a new Claude, from an interactive zsh for the PATH
# the tmux server lacks, and is left at a shell when Claude exits. Only this
# key does: scripts that open a tab and type wt or claude into it (wt-batch,
# wt-open.zsh, the Slack relay's new) open theirs with a shell, as before.
bind -N "New tab, running Claude, in a directory you pick #tabs #claude #new" -n M-t \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 60% -T ' New tab ' "~/.config/tmux/new-tab.zsh"

# M-n is a new tab too, the same as M-t.
bind -N "New tab, running Claude, in a directory you pick (as M-t) #tabs #claude #new" -n M-n \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 60% -T ' New tab ' "~/.config/tmux/new-tab.zsh"

# ── Window naming (palette) ─────────────────────────
# The name replaces the ticket or directory in the tab and the second status
# line until it is cleared. Only from M-p.
bind -T palette -N "Rename the tab #tabs #name" n display-popup -d '#{pane_current_path}' -E -w 90 -h 8 -T ' Name tab ' "~/.config/tmux/tab-name.zsh"

# ── Sidebar and mission control (alt+space) ──────────
# bin/tmux-sidebar draws the tabs in a sidebar on the left of every window,
# most in need of you first, and mission control, every tab with its latest
# Claude turn, full screen. One daemon draws both; tmux/sidebar.sh starts it.
# The sidebar is a pane, reached as any other is (C-w h); in it j/k choose a
# tab and Enter goes there. In mission control hjkl choose and Enter goes there; in either,
# an Alt or Ctrl key you have bound runs in the chosen tab. M-p turns the
# sidebar off and on (it is in the palette table).
#
# The sidebar is a pane, so a binding that acts on "the pane" would act on it
# while it has focus. Those bindings start with leave-sidebar, which hands
# focus back to the pane you came from when the sidebar has it, and does
# nothing otherwise. Give a new pane binding the same start.
set -s command-alias[100] 'leave-sidebar=if -F "#{@sidebar}" "last-pane"'
# M-e puts the one Notes to the right of the pane you are in, and away again
# (tmux/notes-open.sh).
bind -N "Open Notes in a pane to the right, or put it back in its own tab #notes #panes" -n M-e leave-sidebar \; run-shell -b '~/.config/tmux/notes-open.sh side #{q:client_name} #{q:pane_id}'
# M-v shows the branch's PR description, Mermaid diagrams drawn as text, in a
# pane to the right, and closes it again (tmux/pr-view.sh).
bind -N "View the branch's PR description in a pane to the right, or close it #github #pr #panes" -n M-v leave-sidebar \; run-shell -b '~/.config/tmux/pr-view.sh toggle #{q:pane_id}'
# M-i does the same for the branch's Linear ticket, comments included
# (tmux/ticket-view.sh); M-l still opens it in the browser.
bind -N "View the branch's Linear ticket, with its comments, in a pane to the right, or close it #linear #ticket #panes" -n M-i leave-sidebar \; run-shell -b '~/.config/tmux/ticket-view.sh toggle #{q:pane_id}'
# From any pane, not only the one beside it as C-w h is; in the sidebar, back.
bind -N "Jump into the sidebar, or back out of it #sidebar #tabs #navigate" -n M-s if -F '#{@sidebar}' 'last-pane' 'run-shell -b "~/.config/tmux/sidebar.sh focus #{q:window_id}"'
bind -N "Go back to the previous tab #tabs #navigate" -n M-Tab leave-sidebar \; last-window
# A flag of its own, not Claude's "done": visiting the tab doesn't clear it.
# Flagged tabs lead the sidebar's Needs you.
bind -N "Flag or unflag this tab as needing you #tabs #flag" -n M-f if -F '#{@flagged}' 'set -wu @flagged' 'set -w @flagged 1' \; run-shell -b '~/.config/tmux/sidebar.sh nudge'
bind -N "Open or close mission control #sidebar #overview #tabs" -n M-Space run-shell -b '~/.config/tmux/sidebar.sh mission #{q:client_name}'
bind -T palette -N "Turn the sidebar on or off #sidebar" b run-shell -b '~/.config/tmux/sidebar.sh toggle'
# Changes nothing else announces reach the sidebar at once rather than at the
# daemon's next look, five seconds later.
set-hook -g after-new-window "run-shell -b '~/.config/tmux/sidebar.sh nudge'"
# Closing the tab in front puts the cursor in the sidebar of the one that takes
# its place, to pick the next tab from there. session-window-changed runs
# before window-unlinked, so a closed tab is the one in front when it is the
# tab before the last change (@window_before) and the one now in front came
# with that change; a tab closed behind your back, such as the one
# pane-in-place.sh's tool ran in, leaves the cursor where it is.
set-hook -g session-window-changed {
  set -F @window_before '#{@window_now}'
  set -F @window_now '#{window_id}'
}
set-hook -g window-unlinked {
  run-shell -b '~/.config/tmux/sidebar.sh nudge'
  if -F '#{&&:#{==:#{hook_window},#{@window_before}},#{==:#{window_id},#{@window_now}}}' "run-shell -b '~/.config/tmux/sidebar.sh refocus #{q:window_id}'"
}
set-hook -g client-resized "run-shell -b '~/.config/tmux/sidebar.sh nudge'"
# Not while test/tmux-conf.test.js checks this file in a throwaway server
# (@conf_check): starting the daemon, loading the plugins and applying the
# theme act on more than that server.
%if "#{!:#{@conf_check}}"
run-shell -b '~/.config/tmux/sidebar.sh start'
%endif

# ── Pane creation (alt+shift+hjkl) ───────────────────
bind -N "Split pane to the left #panes #split" -n M-H leave-sidebar \; split-window -hb -c "#{pane_current_path}"
bind -N "Split pane below #panes #split" -n M-J leave-sidebar \; split-window -v -c "#{pane_current_path}"
bind -N "Split pane above #panes #split" -n M-K leave-sidebar \; split-window -vb -c "#{pane_current_path}"
bind -N "Split pane to the right #panes #split" -n M-L leave-sidebar \; split-window -h -c "#{pane_current_path}"

# ── Pane close (alt+w) ──────────────────────────────
# display-popup doesn't expand formats in its command, so the pane goes to
# confirm.sh in @confirm_pane, set just before; without it, the script would
# close whatever pane is current once it has swapped a tool's pane back, your
# own pane rather than the tool. Notes beside another pane isn't closed but
# goes back to a tab of its own, as M-e does (tmux/notes-open.sh away).
bind -N "Close the pane #panes #close" -n M-w leave-sidebar \; set -gF @confirm_pane '#{pane_id}' \; \
  if -F '#{@notes_pane}' \
    "run-shell -b '~/.config/tmux/notes-open.sh away #{q:client_name} #{q:pane_id}'" \
    "display-popup -E -w 60 -h 6 \"~/.config/tmux/confirm.sh 'Close pane?'\""

# ── Pane zoom (alt+=) ───────────────────────────────
bind -N "Zoom the pane in or out #panes #layout" -n M-= leave-sidebar \; resize-pane -Z

# ── Pane resizing (alt+shift+arrow) ─────────────────
bind -N "Grow pane left #panes #resize" -n M-S-Left leave-sidebar \; resize-pane -L 5
bind -N "Grow pane down #panes #resize" -n M-S-Down leave-sidebar \; resize-pane -D 5
bind -N "Grow pane up #panes #resize" -n M-S-Up leave-sidebar \; resize-pane -U 5
bind -N "Grow pane right #panes #resize" -n M-S-Right leave-sidebar \; resize-pane -R 5

# ── Lazygit and the diff in place of the pane (palette, alt+d) ──
# Each takes the pane's place, the rest of the window (sidebar included)
# staying as it is, and quitting it puts the pane back (tmux/pane-in-place.sh).
# Its pane is known by its @in_place, since it runs under a shell, which swaps
# the pane back after it, so its command reads zsh. Asked for again in it, it
# quits: C-c for lazygit (q would be typed into a commit message), :qa for the
# diff's Neovim. Lazygit has no hotkey, only the palette and the sidebar's L.
bind -T palette -N "Open lazygit in place of this pane, or quit it; quitting brings the pane back #git #commit #stage" l leave-sidebar \; if-shell -F '#{||:#{==:#{pane_current_command},lazygit},#{==:#{@in_place},lazygit}}' \
  'send-keys C-c' \
  'run-shell -b "~/.config/tmux/pane-in-place.sh open lazygit #{q:pane_id} #{q:pane_current_path} #{q:client_name}"'
bind -N "Open the branch's diff against main in place of this pane (diffview), or close it #git #diff #review" -n M-d leave-sidebar \; if-shell -F '#{==:#{@in_place},diffview}' \
  'send-keys Escape :qa Enter' \
  'run-shell -b "~/.config/tmux/pane-in-place.sh open diffview #{q:pane_id} #{q:pane_current_path} #{q:client_name}"'

# ── Theme toggle (palette) ───────────────────────────
bind -T palette -N "Toggle light and dark theme #theme #colors" d run-shell '~/.config/tmux/theme.sh toggle'

# ── Action palette (alt+p) ──────────────────────────
# fzf over every binding above that has a -N description; give a new binding
# one and it shows up here. Commands with no hotkey of their own are bound in
# the palette table, which no key leads to: they are reached only from here,
# and the M-p binding switches the client to that table before pressing them.
# The popup holds the command queue until it closes,
# so the run-shell after it presses the picked key in the pane you came from,
# exactly as if you had typed it. A prefix binding is two keys, sent one call
# at a time because tmux does not act on the second when both arrive in one.
# set -f because keys like M-[ are glob patterns to sh.
bind -N "Show this list #palette" -n M-p display-popup -E -w 60% -h 60% -T ' Actions ' '~/.config/tmux/palette.sh' \; \
  run-shell 'set -f; k=$(tmux show -gqv @palette_choice); tmux set -gu @palette_choice; for key in $k; do if [ "$key" = @palette ]; then tmux switch-client -c #{q:client_name} -T palette; else tmux send-keys -K -c #{q:client_name} "$key"; fi; done'
# The path goes in as the popup's start directory: tmux expands formats in -d
# but passes them through untouched in the command, where the shell then reads
# the # as the start of a comment.
bind -N "Check whether the branch's PR is ready to merge #github #pr #merge #checks" -n M-m \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 16 -T ' Ready to merge? ' "~/.config/tmux/pr-ready.sh --wait"
bind -N "Open the branch's PR in the browser #github #pr #browser" -n M-r run-shell -b 'cd #{q:pane_current_path} && gh pr view --web 2>/dev/null'
bind -N "Start work on tickets in new tabs (wt) #linear #ticket #worktree #new" -n M-W \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 10 -T ' Work on tickets ' "~/.config/tmux/wt-open.zsh"
bind -N "Start work on a branch, new or existing, in a new tab (wtb) #git #branch #worktree #new" -n M-B \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 20 -T ' Work on a branch ' "~/.config/tmux/wtb-open.zsh"
bind -N "Open the branch's Linear ticket in the browser #linear #ticket #browser" -n M-l run-shell -b '~/.config/tmux/linear-ticket.sh #{q:pane_current_path}'
# M-p only (see the palette above): no hotkeys.
bind -T palette -N "View the branch's PR description as an image, as GitHub draws it (trial) #github #pr #panes" v leave-sidebar \; run-shell -b '~/.config/tmux/pr-image.sh toggle #{q:pane_id}'
bind -T palette -N "Update local main to origin's, without switching branches #git #main #sync" u \
  display-popup -d '#{pane_current_path}' -E -w 100 -h 8 -T ' Update main ' "~/.config/tmux/update-main.sh"
bind -T palette -N "Start work on a PR in a new tab (wtpr) #github #pr #worktree #new" w \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 9 -T ' Work on a PR ' "~/.config/tmux/wtpr-open.zsh"
bind -T palette -N "Open a PR in the browser by number or URL #github #pr #browser" R \
  display-popup -d '#{pane_current_path}' -E -w 80 -h 9 -T ' Open PR ' "~/.config/tmux/pr-open.zsh"
bind -T palette -N "Open a Linear ticket in the browser by ID, number or URL #linear #ticket #browser" i \
  display-popup -d '#{pane_current_path}' -E -w 90 -h 9 -T ' Open ticket ' "~/.config/tmux/ticket-open.zsh"
bind -T palette -N "Open the repository in the browser #github #repo #browser" g run-shell -b 'cd #{q:pane_current_path} && gh repo view --web 2>/dev/null'
# A popup while it asks GitHub which queue, so picking it visibly did
# something; it closes when the browser opens.
bind -T palette -N "Open the repository's merge queue in the browser #github #merge #browser" q \
  display-popup -d '#{pane_current_path}' -E -w 50 -h 5 -T ' Merge queue ' "~/.config/tmux/merge-queue.sh"
bind -T palette -N "Open the branch's Linear project in the browser #linear #project #browser" L run-shell -b '~/.config/tmux/linear-project.sh #{q:pane_current_path} #{q:client_name}'
# The SSO session comes from ~/.aws/config and the Chrome profile from
# ~/.config/aws-login/config (see aws-login.sh). The popup stays open through
# the login, for its code and any error.
bind -T palette -N "Log in to AWS (aws sso login) in your Chrome profile #aws #login #sso" A \
  display-popup -E -w 90 -h 16 -T ' AWS login ' "~/.config/tmux/aws-login.sh"
bind -T palette -N "Copy the branch's ticket ID #linear #ticket #copy" t run-shell -b '~/.config/tmux/branch-copy.sh ticket #{q:pane_current_path}'
bind -T palette -N "Copy the branch's ticket URL #linear #ticket #copy" T run-shell -b '~/.config/tmux/branch-copy.sh ticket-url #{q:pane_current_path}'
bind -T palette -N "Copy the branch's PR number #github #pr #copy" p run-shell -b '~/.config/tmux/branch-copy.sh pr #{q:pane_current_path}'
bind -T palette -N "Copy the branch's PR URL #github #pr #copy" P run-shell -b '~/.config/tmux/branch-copy.sh pr-url #{q:pane_current_path}'
bind -T palette -N "Continue shaping Linear tickets, each in a new tab #linear #ticket #shape" c display-popup -d '#{pane_current_path}' -E -w 90 -h 60% -T ' Continue shaping ' '~/.config/tmux/shape-open.zsh'
bind -T palette -N "Shape a note's checklist items as Linear tickets #notes #linear #shape" s display-popup -d '#{pane_current_path}' -E -w 110 -h 70% -T ' Shape a note ' '~/.config/tmux/note-shape.sh'
bind -T palette -N "Send Claude's last reply to another tab #claude #reply #tabs" r display-popup -E -w 100 -h 60% -T ' Send the last reply to ' '~/.config/tmux/reply-send.sh'

# ── Accent color (derived from directory + git context) ─
# Updates pane border, session badge, and all window tab colors and names on
# pane focus. Tab names carry their PR number when there is one, which
# window-pr.sh looks up in the background so this stays instant.
# Focusing a sidebar changes neither, so it runs only agent-state.sh, which
# also tells the sidebar to redraw.
set-hook -g pane-focus-in {
  if -F '#{@sidebar}' '' "run-shell -b '~/.config/tmux/update-colors.sh #{q:pane_current_path} #{q:session_name}'"
  run-shell -b '~/.config/tmux/agent-state.sh seen #{q:window_id}'
}

# ── Plugins ───────────────────────────────────────────
# Pinned in tmux/plugins.txt and installed at those commits by `./sync.sh tmux`.
# No plugin manager: TPM cloned itself from its default branch and ran it on
# every start. Each plugin is loaded below, after its options are set.

# Auto-restore sessions on tmux start. The layout is saved every minute, so an
# unplanned restart (a crash, a kill-server, a reboot) loses at most a minute;
# a save that finds nothing changed keeps nothing.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
# Each save keeps a layout file (paths and commands, never what panes show,
# which is in one archive each save replaces); keep two days of them, not
# resurrect's thirty. It always keeps the last five.
set -g @resurrect-delete-backup-after '2'
# Only Claude comes back running: a pane whose command was `claude …` gets
# `claude-here`, which resumes that directory's last session rather than
# retyping the prompt it was started with (which would start the work over).
# This replaces resurrect's default list (vim, less, man…), so every other
# pane comes back at a shell, as before.
set -g @resurrect-default-processes '"claude->claude-here"'
# Saves hold pane contents, so they are made owner-only and trimmed to the
# newest few after each one (see resurrect-tidy.sh).
set -g @resurrect-hook-post-save-all '~/.config/tmux/resurrect-tidy.sh'
# A sidebar added to a window resurrect is still laying out would throw its
# layout off, so the sidebar waits until the restore is done. Sidebar panes
# come back as shells with the sidebar's title, and are given their client again.
set -g @resurrect-hook-pre-restore-all 'tmux set -g @sidebar_hold "$(date +%s)"'
set -g @resurrect-hook-post-restore-all 'tmux set -gu @sidebar_hold; ~/.config/tmux/sidebar.sh nudge'

# Continuum needs resurrect loaded first. A plugin that is missing is skipped
# rather than an error; `./sync.sh tmux` installs it.
%if "#{!:#{@conf_check}}"
if "test -x ~/.config/tmux/plugins/tmux-sensible/sensible.tmux" "run ~/.config/tmux/plugins/tmux-sensible/sensible.tmux"
if "test -x ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux" "run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if "test -x ~/.config/tmux/plugins/tmux-continuum/continuum.tmux" "run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"

# ── Apply persisted theme (dark/light) ────────────────
run-shell '~/.config/tmux/theme.sh "$(cat ~/.config/tmux/.theme-mode 2>/dev/null || echo dark)"'
%endif
